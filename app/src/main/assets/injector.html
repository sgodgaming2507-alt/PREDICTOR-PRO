<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XS Store Pro</title>
    <style>
        body {
            background: transparent;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px #39ff14;
            border-radius: 12px;
            width: 260px;
            padding: 12px;
            text-align: center;
            color: white;
        }
        .header {
            font-size: 14px;
            font-weight: bold;
            color: #39ff14;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-btn {
            background: none;
            border: none;
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #39ff14;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
            font-size: 16px;
            font-weight: bold;
            color: #39ff14;
            box-shadow: 0 0 10px #39ff14 inset;
        }
        .btn {
            background: linear-gradient(45deg, #ff0000, #ff7700);
            border: none;
            color: white;
            padding: 8px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }
        .period {
            margin-top: 10px;
            font-size: 11px;
            background: #222;
            padding: 5px;
            border-radius: 4px;
            color: #39ff14;
            border: 1px dashed #39ff14;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span>XS STORE PRO</span>
            <button class="close-btn" onclick="closeApp()">×</button>
        </div>
        <div class="result-box" id="result">READY</div>
        <button class="btn" onclick="startHack()">⚡ START HACK ⚡</button>
        <div class="period" id="periodText">PERIOD: 20260117XXXX--</div>
    </div>

    <script>
        function startHack() {
            const results = ["BIG", "SMALL"];
            const randomRes = results[Math.floor(Math.random() * results.length)];
            const resBox = document.getElementById("result");
            
            resBox.innerText = "...";
            
            setTimeout(() => {
                resBox.innerText = randomRes;
                if(randomRes === "BIG") {
                    resBox.style.color = "#39ff14";
                    resBox.style.borderColor = "#39ff14";
                } else {
                    resBox.style.color = "#ff3333";
                    resBox.style.borderColor = "#ff3333";
                }
                
                const randomPeriod = "20260117" + Math.floor(1000 + Math.random() * 9000);
                document.getElementById("periodText").innerText = "PERIOD: " + randomPeriod;
            }, 600);
        }

        function closeApp() {
            try {
                Android.closeMenu();
            } catch(e) {
                window.close();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XS Store Pro</title>
    <style>
        body {
            background: transparent;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px #39ff14;
            border-radius: 12px;
            width: 270px;
            padding: 10px;
            text-align: center;
            color: white;
        }
        .header {
            font-size: 13px;
            font-weight: bold;
            color: #39ff14;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timer-badge {
            background: #222;
            color: #ff3333;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #ff3333;
        }
        .close-btn {
            background: none;
            border: none;
            color: #ff3333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #39ff14;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px auto;
            font-size: 14px;
            font-weight: bold;
            color: #39ff14;
            box-shadow: 0 0 10px #39ff14 inset;
        }
        .btn {
            background: linear-gradient(45deg, #ff0000, #ff7700);
            border: none;
            color: white;
            padding: 7px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }
        .period {
            margin-top: 8px;
            font-size: 11px;
            background: #222;
            padding: 5px;
            border-radius: 4px;
            color: #39ff14;
            border: 1px dashed #39ff14;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span>XS STORE PRO</span>
            <span class="timer-badge" id="timer">00:30</span>
            <button class="close-btn" onclick="closeApp()">×</button>
        </div>
        <div class="result-box" id="result">READY</div>
        <button class="btn" onclick="startHack()">⚡ START HACK ⚡</button>
        <div class="period" id="periodText">PERIOD: --</div>
    </div>

    <script>
        let currentPeriod = "";
        let currentPrediction = "READY";

        // Real-time timer and period generator sync
        function updateTimerAndPeriod() {
            const now = new Date();
            const seconds = now.getSeconds();
            let remaining = 59 - seconds;
            if (remaining >= 30) remaining -= 30;
            
            const timerFormatted = "00:" + (remaining < 10 ? "0" : "") + remaining;
            document.getElementById("timer").innerText = timerFormatted;

            // Generate base period format matching game timestamp style
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            const totalMinutes = now.getHours() * 60 + now.getMinutes();
            const periodCode = year + month + day + "01" + (10000 + totalMinutes);
            
            if (currentPeriod !== periodCode) {
                currentPeriod = periodCode;
                // Lock prediction for this period so it doesn't change randomly
                const results = ["BIG", "SMALL"];
                currentPrediction = results[Math.floor(Math.random() * results.length)];
            }

            document.getElementById("periodText").innerText = "PERIOD: " + currentPeriod;
        }

        setInterval(updateTimerAndPeriod, 1000);

        function startHack() {
            const resBox = document.getElementById("result");
            resBox.innerText = currentPrediction;
            
            if(currentPrediction === "BIG") {
                resBox.style.color = "#39ff14";
                resBox.style.borderColor = "#39ff14";
                resBox.style.boxShadow = "0 0 10px #39ff14 inset";
            } else {
                resBox.style.color = "#ff3333";
                resBox.style.borderColor = "#ff3333";
                resBox.style.boxShadow = "0 0 10px #ff3333 inset";
            }
        }

        function closeApp() {
            try {
                Android.closeMenu();
            } catch(e) {
                window.close();
            }
        }
    </script>
</body>
</html>

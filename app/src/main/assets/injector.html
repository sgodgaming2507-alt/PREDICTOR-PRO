<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XS Store Pro</title>
    <style>
        body {
            background: transparent;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px #39ff14;
            border-radius: 12px;
            width: 270px;
            padding: 10px;
            text-align: center;
            color: white;
            position: relative;
        }
        .header {
            font-size: 13px;
            font-weight: bold;
            color: #39ff14;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .timer-badge {
            background: #222;
            color: #ff3333;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #ff3333;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 3px;
        }
        .minimize-btn { color: #ffaa00; }
        .close-btn { color: #ff3333; }
        
        .result-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #39ff14;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px auto;
            font-size: 14px;
            font-weight: bold;
            color: #39ff14;
            box-shadow: 0 0 10px #39ff14 inset;
        }
        .btn {
            background: linear-gradient(45deg, #ff0000, #ff7700);
            border: none;
            color: white;
            padding: 7px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
        }
        .period {
            margin-top: 8px;
            font-size: 11px;
            background: #222;
            padding: 5px;
            border-radius: 4px;
            color: #39ff14;
            border: 1px dashed #39ff14;
        }
        .minimized-ball {
            display: none;
            background: #111;
            border: 2px solid #39ff14;
            color: #39ff14;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 10px #39ff14;
            cursor: pointer;
            text-align: center;
            line-height: 41px;
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="header">
            <span>XS STORE PRO</span>
            <div class="controls">
                <span class="timer-badge" id="timer">00:30</span>
                <button class="action-btn minimize-btn" onclick="minimizeApp()">-</button>
                <button class="action-btn close-btn" onclick="closeApp()">×</button>
            </div>
        </div>
        <div class="result-box" id="result">READY</div>
        <button class="btn" onclick="startHack()">⚡ START HACK ⚡</button>
        <div class="period" id="periodText">PERIOD: --</div>
    </div>

    <div class="minimized-ball" id="minBall" onclick="restoreApp()">XS</div>

    <script>
        let currentPeriod = "";
        let currentPrediction = "READY";

        function updateTimerAndPeriod() {
            const now = new Date();
            const seconds = now.getSeconds();
            let remaining = 59 - seconds;
            if (remaining >= 30) remaining -= 30;
            
            const timerFormatted = "00:" + (remaining < 10 ? "0" : "") + remaining;
            document.getElementById("timer").innerText = timerFormatted;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            const totalSecondsToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const periodIndex = Math.floor(totalSecondsToday / 30);
            const periodCode = year + month + day + "01" + (100000 + periodIndex);
            
            if (currentPeriod !== periodCode) {
                currentPeriod = periodCode;
                
                // Advanced Smart Formula based on period last digits
                const lastDigit = parseInt(periodCode.slice(-1));
                const secondLastDigit = parseInt(periodCode.slice(-2, -1));
                
                // Mix up logic so it alternates evenly between BIG and SMALL
                if ((lastDigit + secondLastDigit) % 2 === 0) {
                    currentPrediction = "BIG";
                } else {
                    currentPrediction = "SMALL";
                }
            }

            document.getElementById("periodText").innerText = "PERIOD: " + currentPeriod;
        }

        setInterval(updateTimerAndPeriod, 1000);

        function startHack() {
            const resBox = document.getElementById("result");
            resBox.innerText = "...";
            
            setTimeout(() => {
                resBox.innerText = currentPrediction;
                
                if(currentPrediction === "BIG") {
                    resBox.style.color = "#39ff14";
                    resBox.style.borderColor = "#39ff14";
                    resBox.style.boxShadow = "0 0 10px #39ff14 inset";
                } else {
                    resBox.style.color = "#ff3333";
                    resBox.style.borderColor = "#ff3333";
                    resBox.style.boxShadow = "0 0 10px #ff3333 inset";
                }
            }, 400);
        }

        function minimizeApp() {
            document.getElementById("mainCard").style.display = "none";
            document.getElementById("minBall").style.display = "flex";
        }

        function restoreApp() {
            document.getElementById("minBall").style.display = "none";
            document.getElementById("mainCard").style.display = "block";
        }

        function closeApp() {
            try {
                Android.closeMenu();
            } catch(e) {
                window.close();
            }
        }
    </script>
</body>
</html>
